<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qazibazar | قازی بازار - سەکۆی مۆدێرنی بەرهەمی لۆکاڵی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <style>
        :root {
            --bg-main: #fcfcfd;
            --surface: #ffffff;
            --text-dark: #090d16;
            --text-muted: #667085;
            --accent-green: #079455;
            --accent-red: #d92d20;
            --accent-gold: #eab308;
            --border-subtle: #f2f4f7;
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
            --shadow-md: 0 12px 16px -4px rgba(16, 24, 40, 0.08), 0 4px 6px -2px rgba(16, 24, 40, 0.03);
            --radius-md: 12px;
            --radius-lg: 20px;
            --brand-ink: #090d16; /* هەمیشە تاریکە، گۆڕان بە دۆخی تاریک/ڕووناک ناکات — بۆ دوگمە سەرەکییەکان */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-dark); min-height: 100vh; overflow-x: hidden; letter-spacing: -0.2px; }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 14px 6%; background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05); position: sticky; top: 0; z-index: 100;
        }
        .logo-area { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        
        .kurdish-flag { 
            width: 34px; height: 21px; border-radius: 4px; overflow: hidden; 
            display: flex; flex-direction: column; position: relative; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.15); animation: waveMoving 1.2s ease-in-out infinite alternate; transform-origin: left center;
        }
        .flag-red { flex: 1; background: var(--accent-red); }
        .flag-white { flex: 1; background: #ffffff; }
        .flag-green { flex: 1; background: var(--accent-green); }
        .flag-sun { position: absolute; width: 7px; height: 7px; background: #fab814; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        @keyframes waveMoving { 0% { transform: rotate(0deg) skewY(-3deg) scaleY(0.95); } 100% { transform: rotate(2deg) skewY(4deg) scaleY(1.05); } }

        .logo-text h1 { font-size: 19px; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px; }
        .logo-text p { font-size: 9px; color: var(--accent-green); font-weight: 700; letter-spacing: 0.5px; margin-top: -2px; }
        
        .nav-left { display: flex; gap: 14px; align-items: center; }
        .btn-add-product { background: var(--brand-ink); color: #fff; border: none; padding: 10px 20px; border-radius: var(--radius-md); font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform 0.2s, background 0.2s; }
        .btn-add-product:hover { background: #1d2939; transform: translateY(-1px); }
        .user-badge { color: var(--accent-green); font-size: 13px; font-weight: 700; background: #ecfdf3; padding: 6px 14px; border-radius: var(--radius-md); display: none; }

        .menu-toggle { background: #f2f4f7; border: none; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; width: 40px; height: 40px; border-radius: var(--radius-md); }
        .menu-toggle span { width: 18px; height: 2px; background: var(--text-dark); border-radius: 2px; transition: 0.2s; }
        .menu-toggle:hover { background: #eaecf0; }

        .nav-drawer { position: fixed; top: 0; left: -360px; width: 360px; height: 100%; background: var(--surface); box-shadow: var(--shadow-md); z-index: 999; padding: 30px 20px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .nav-drawer.open { left: 0; }
        .drawer-overlay { opacity: 0; visibility: hidden; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 13, 22, 0.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 998; transition: all 0.3s ease; }
        .drawer-overlay.open { opacity: 1; visibility: visible; }
        
        .drawer-header-area { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-subtle); padding-bottom: 15px; margin-bottom: 5px; }
        .drawer-close-btn { background: #f2f4f7; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
        .drawer-close-btn:hover { background: #eaecf0; color: var(--text-dark); }

        .menu-main-title { font-size: 15px; font-weight: 800; color: var(--text-dark); margin-bottom: 10px; padding-right: 5px; opacity: 0.9; }
        .accordion-container { display: flex; flex-direction: column; gap: 8px; }
        .accordion-item { background: #f9fafb; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
        .accordion-header { width: 100%; background: none; border: none; outline: none; text-align: right; padding: 14px 16px; font-size: 14px; font-weight: 700; color: #344054; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .accordion-header:hover { background: #f2f4f7; color: var(--text-dark); }
        .accordion-header span { font-size: 16px; color: var(--text-muted); transition: transform 0.2s; }
        .accordion-panel { max-height: 0; overflow: hidden; background: #ffffff; transition: max-height 0.25s ease-out; display: flex; flex-direction: column; }
        .accordion-panel a { padding: 11px 24px; text-decoration: none; color: #475467; font-size: 13px; font-weight: 500; border-bottom: 1px solid #f9fafb; transition: all 0.2s; }
        .accordion-panel a:hover { background: #fdfaf2; color: var(--text-dark); padding-right: 28px; }
        .accordion-item.active .accordion-panel { border-top: 1px solid var(--border-subtle); }
        .more-option { color: var(--accent-green) !important; font-weight: 700 !important; }
        .drawer-info-text { font-size: 13px; color: var(--text-muted); line-height: 1.6; padding: 0 5px; }

        .main-container { max-width: 1300px; margin: 40px auto; padding: 0 5%; }
        .view-section { display: none; }
        .view-section.active { display: block; }

        .search-container {
            position: relative;
            width: 100%;
            max-width: 350px;
        }
        .search-input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }
        .search-input:focus { border-color: var(--text-dark); }
        .search-icon { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); color: var(--text-muted); width: 18px; height: 18px; }

        .top-action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 10px; }
        .btn-back { background: #f2f4f7; color: var(--text-dark); border: none; padding: 8px 16px; border-radius: var(--radius-md); font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; text-decoration: none; }
        .btn-back:hover { background: #eaecf0; }

        .grid-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 32px; }
        
        .product-card { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); position: relative; display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease; cursor: pointer; }
        .product-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); border-color: #dee2e6; }
        
        .product-img-wrapper { width: 100%; height: 240px; overflow: hidden; background: #f9fafb; position: relative; }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .product-card:hover .product-img { transform: scale(1.04); }
        
        .product-city-badge { position: absolute; top: 14px; right: 14px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding: 5px 12px; border-radius: 30px; font-size: 11.5px; font-weight: 700; color: var(--text-dark); box-shadow: var(--shadow-sm); z-index: 2; }
        .vip-badge { position: absolute; top: 14px; left: 14px; background: var(--accent-gold); color: #000; padding: 5px 14px; border-radius: 30px; font-size: 11px; font-weight: 800; box-shadow: var(--shadow-sm); z-index: 2; animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow { 0% { opacity: 0.9; } 50% { opacity: 1; box-shadow: 0 0 10px rgba(234, 179, 8, 0.5); } 100% { opacity: 0.9; } }
        .product-card.vip-card { border: 1.5px solid var(--accent-gold); }

        .product-info { padding: 22px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-cat { font-size: 11px; color: var(--accent-green); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .product-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--text-dark); line-height: 1.4; }
        .product-meta { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-subtle); padding-top: 14px; margin-top: auto; }
        .product-price { color: var(--text-dark); font-weight: 800; font-size: 17px; }
        
        .btn-buy { background: var(--brand-ink); color: #fff; border: none; padding: 10px 18px; border-radius: var(--radius-md); font-weight: 700; font-size: 12.5px; text-decoration: none; text-align: center; box-shadow: var(--shadow-sm); }

        .form-box { max-width: 540px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border-subtle); padding: 40px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
        .form-box h2 { margin-bottom: 24px; font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #344054; }
        .form-control { width: 100%; background: #f9fafb; border: 1px solid #d0d5dd; padding: 12px 14px; border-radius: var(--radius-md); color: var(--text-dark); font-size: 14px; }
        .form-control:focus { outline: none; border-color: var(--text-dark); background: #fff; box-shadow: 0 0 0 4px rgba(9, 13, 22, 0.05); }
        .btn-submit { width: 100%; background: var(--brand-ink); color: #fff; border: none; padding: 14px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; font-size: 14px; margin-top: 10px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 13, 22, 0.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--surface); border: 1px solid var(--border-subtle); padding: 35px; border-radius: var(--radius-lg); max-width: 400px; width: 92%; text-align: center; box-shadow: var(--shadow-md); position: relative; }
        .close-modal-btn { position: absolute; top: 15px; left: 15px; background: #f2f4f7; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; color: var(--text-muted); z-index: 10; display: flex; align-items: center; justify-content: center; }

        /* سیستەمی نوێی مۆداڵی وردەکاری کاڵاکان لەگەڵ Swiper Zoom Slider */
        .detail-modal-card { max-width: 600px; width: 92%; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); display: flex; flex-direction: column; position: relative; animation: modalFade 0.3s ease; }
        @keyframes modalFade { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        /* زیادکردنی ماکسیمەم بەرزی بۆ مۆداڵەکە تاوەکو لە شاشە گەورەکاندا زۆر درێژ نەبێتەوە */
        .detail-modal-card { max-height: 90vh; }

        .swiper-container-wrapper { width: 100%; height: 340px; position: relative; background: #f9fafb; overflow: hidden; }
        .swiper { width: 100%; height: 100%; }
        .swiper-slide { overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        
        .swiper-button-next, .swiper-button-prev { color: var(--text-dark) !important; background: rgba(255, 255, 255, 0.7); width: 36px !important; height: 36px !important; border-radius: 50%; box-shadow: var(--shadow-sm); backdrop-filter: blur(4px); }
        .swiper-button-next::after, .swiper-button-prev::after { font-size: 14px !important; font-weight: bold; }
        .swiper-pagination-bullet-active { background: var(--text-dark) !important; }
        
        .detail-body { padding: 30px; text-align: right; flex-grow: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--text-muted) var(--border-subtle); }
        .detail-body::-webkit-scrollbar { width: 8px; }
        .detail-body::-webkit-scrollbar-track { background: var(--border-subtle); border-radius: 10px; }
        .detail-body::-webkit-scrollbar-thumb { background-color: var(--text-muted); border-radius: 10px; border: 2px solid var(--border-subtle); }
        .detail-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; color: var(--text-dark); }
        .detail-price { font-size: 20px; font-weight: 800; color: var(--accent-green); margin-bottom: 15px; }
        .detail-desc { font-size: 14px; color: var(--text-muted); line-height: 1.7; margin-bottom: 20px; background: #f9fafb; padding: 15px; border-radius: var(--radius-md); }
        .detail-grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; border-top: 1px solid var(--border-subtle); padding-top: 15px; }
        .info-tag { font-size: 13px; color: #344054; font-weight: 600; }

        .no-data { text-align: center; color: var(--text-muted); padding: 80px 0; grid-column: 1 / -1; font-size: 14px; font-weight: 500; }

        /* ===================== دۆخی تاریک (Dark Mode) ===================== */
        html[data-theme="dark"] {
            --bg-main: #0b0f19;
            --surface: #131a2a;
            --text-dark: #f2f4f7;
            --text-muted: #98a2b3;
            --border-subtle: #232b3d;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 12px 20px -4px rgba(0,0,0,0.5);
        }
        html[data-theme="dark"] .search-input,
        html[data-theme="dark"] .form-control { background: #0f1524; color: var(--text-dark); border-color: #232b3d; }
        html[data-theme="dark"] .accordion-item { background: #0f1524; border-color: #232b3d; }
        html[data-theme="dark"] .accordion-panel { background: #131a2a; }
        html[data-theme="dark"] .accordion-panel a { border-color: #1b2233; color: #c3c9d4; }
        html[data-theme="dark"] header { background: rgba(11,15,25,0.85); }
        html[data-theme="dark"] .menu-toggle, html[data-theme="dark"] .btn-back, html[data-theme="dark"] .drawer-close-btn, html[data-theme="dark"] .close-modal-btn { background: #1b2233; color: #dfe3ea; }
        html[data-theme="dark"] .product-img-wrapper, html[data-theme="dark"] .detail-desc { background: #0f1524; }
        html[data-theme="dark"] .user-badge { background: rgba(7,148,85,0.18); }
        html[data-theme="dark"] .product-city-badge { background: rgba(19,26,42,0.85); color: #f2f4f7; }
        html[data-theme="dark"] .swiper-button-next, html[data-theme="dark"] .swiper-button-prev { background: rgba(19,26,42,0.85); color: #f2f4f7 !important; }
        html[data-theme="dark"] .role-status-box { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.35); color: #fcd34d; }
        html[data-theme="dark"] .role-status-box.ok { background: rgba(7,148,85,0.15); border-color: rgba(7,148,85,0.4); color: #6ee7b7; }
        html[data-theme="dark"] .otp-secret-box { background: #0f1524; border-color: #333f57; color: #f2f4f7; }
        html[data-theme="dark"] #modal-detail-seller-btn { background: rgba(67,56,202,0.18) !important; color: #a5b4fc !important; }
        html * { transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }

        .theme-toggle-btn { background: #f2f4f7; border: none; width: 40px; height: 40px; border-radius: var(--radius-md); cursor: pointer; font-size: 17px; display: flex; align-items: center; justify-content: center; }
        html[data-theme="dark"] .theme-toggle-btn { background: #1b2233; }

        /* ===================== بەکارهێنەر / پرۆفایل ===================== */
        .avatar-btn { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; border: 2px solid var(--border-subtle); cursor: pointer; display: none; background: #eaecf0; flex-shrink: 0; }
        .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
        .btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; border: 1px solid #d0d5dd; padding: 12px; border-radius: var(--radius-md); font-weight: 700; font-size: 14px; cursor: pointer; color: #1e293b; }
        .btn-google:hover { background: #f9fafb; }
        .role-status-box { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 14px 16px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; line-height: 1.6; margin-bottom: 16px; text-align: right; }
        .role-status-box.ok { background: #ecfdf3; border-color: #a6f4c5; color: #065f46; }

        .avatar-upload-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 18px; }
        .avatar-upload-wrap img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-subtle); background: #eaecf0; }
        .cover-swatches { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
        .cover-swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .cover-swatch.selected { border-color: var(--text-dark); }

        /* ===================== پرۆفایلی گشتی فرۆشیار ===================== */
        .seller-cover { height: 110px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
        .seller-card-wrap { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); max-width: 720px; margin: 0 auto 30px; }
        .seller-header { padding: 0 26px 24px; margin-top: -42px; display: flex; align-items: flex-end; gap: 16px; }
        .seller
